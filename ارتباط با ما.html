<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arian moridi</title>
    <style>
        :root {
            --bg-color: #030704;
            --neon-green: #00ff66;
            --neon-glow: rgba(0, 255, 102, 0.4);
            --text-color: #e0f8ec;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0,255,102,0.15) 0%, rgba(3,7,4,0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        header {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 20px;
            z-index: 1;
        }

        header a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
            text-shadow: 0 0 5px rgba(0,255,102,0.3);
        }

        header a:hover {
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
        }

        main {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 50px;
            padding: 40px;
            z-index: 1;
            margin: auto;
            flex-wrap: wrap;
        }

        .profile-container {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(145deg, #00ff66, #003311);
            box-shadow: 0 0 30px var(--neon-glow), inset 0 0 15px rgba(0,255,102,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse-glow 3s infinite alternate;
        }

        .intro-text {
            text-align: center;
        }

        .intro-text h1 {
            font-size: 2.5rem;
            color: #ffffff;
            text-shadow: 0 0 15px var(--neon-glow);
            margin-bottom: 20px;
        }

        .btn-neon {
            display: inline-block;
            padding: 12px 30px;
            background: transparent;
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0,255,102,0.2);
            transition: 0.4s;
        }

        .btn-neon:hover {
            background: var(--neon-green);
            color: var(--bg-color);
            box-shadow: 0 0 25px var(--neon-green);
        }

        footer {
            text-align: center;
            padding: 15px;
            background: linear-gradient(90deg, transparent, rgba(0,255,102,0.1), transparent);
            border-top: 1px solid rgba(0,255,102,0.2);
            z-index: 1;
            font-size: 13px;
            color: #7ab899;
        }

        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
            }
            100% {
                box-shadow: 0 0 45px rgba(0, 255, 102, 0.7);
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="نمونه کار.html">نمونه کار</a>
        <a href="index.html">خونه</a>
    </header>

    <main>
        <div class="intro-text">
            <h1>ارتباط با ما</h1>
            <h1>Email: aryan92jan@gmail.com</h1>
            <h1>09220591079</h1>

            <a href="صفحه شخصی.html" class="btn-neon">صفحه شخصی آرین</a>
        </div>
    </main>
    <footer>
        <span>کپی رایت ممنوع🚀<br>aryan92jan@gmail.com</span></br>
    </footer>
</body>
</html>
